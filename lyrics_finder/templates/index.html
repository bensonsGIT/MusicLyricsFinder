<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lyrics Finder</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg:          #0b0b14;
  --surface:     #13131f;
  --card:        #18182a;
  --card-hover:  #1e1e35;
  --border:      #2a2a45;
  --border2:     #3a3a5c;
  --accent:      #7c3aed;
  --accent-lt:   #a78bfa;
  --accent-glow: rgba(124,58,237,.35);
  --success:     #10b981;
  --warn:        #f59e0b;
  --error:       #ef4444;
  --info:        #3b82f6;
  --text:        #ede9fe;
  --text-dim:    #9d9db8;
  --text-muted:  #5a5a7a;
  --radius:      10px;
  --shadow:      0 4px 24px rgba(0,0,0,.5);
}

html { font-size: 15px; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
  min-height: 100vh;
  padding-bottom: 60px;
}

/* ── Header ── */
header {
  background: linear-gradient(135deg, #1a0a3d 0%, #0d1b4a 50%, #0b0b14 100%);
  border-bottom: 1px solid var(--border);
  padding: 28px 40px 24px;
  position: sticky; top: 0; z-index: 100;
}
.header-inner {
  max-width: 1100px; margin: 0 auto;
  display: flex; align-items: center; gap: 16px;
}
.logo {
  width: 44px; height: 44px;
  background: linear-gradient(135deg, var(--accent), #4f46e5);
  border-radius: 12px;
  display: flex; align-items: center; justify-content: center;
  font-size: 22px;
  box-shadow: 0 0 20px var(--accent-glow);
  flex-shrink: 0;
}
.header-text h1 { font-size: 1.4rem; font-weight: 700; letter-spacing: -.3px; }
.header-text p  { font-size: .8rem; color: var(--text-dim); margin-top: 2px; }
.free-badge {
  margin-left: auto;
  background: rgba(16,185,129,.12);
  border: 1px solid rgba(16,185,129,.3);
  color: var(--success);
  font-size: .72rem; font-weight: 700;
  padding: 4px 10px; border-radius: 20px;
  letter-spacing: .04em;
}

/* ── Main ── */
main {
  max-width: 1100px; margin: 28px auto;
  padding: 0 24px;
  display: flex; flex-direction: column; gap: 18px;
}

/* ── Panel ── */
.panel {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
}
.panel-header {
  padding: 13px 20px;
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; gap: 10px;
  font-size: .78rem; font-weight: 600;
  letter-spacing: .06em; text-transform: uppercase;
  color: var(--text-dim);
}
.panel-body { padding: 18px 20px; }

/* ── Controls ── */
label { display: block; font-size: .8rem; color: var(--text-dim); margin-bottom: 6px; font-weight: 500; }
input[type=text], input[type=password] {
  width: 100%;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 8px;
  color: var(--text);
  font-size: .9rem;
  padding: 10px 14px;
  outline: none;
  transition: border-color .2s, box-shadow .2s;
}
input:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px var(--accent-glow);
}
input::placeholder { color: var(--text-muted); }

button {
  cursor: pointer; border: none;
  border-radius: 8px;
  font-size: .85rem; font-weight: 600;
  padding: 10px 18px;
  transition: all .18s;
  white-space: nowrap;
}
.btn-primary {
  background: linear-gradient(135deg, var(--accent), #4f46e5);
  color: #fff;
  box-shadow: 0 2px 12px var(--accent-glow);
}
.btn-primary:hover  { transform: translateY(-1px); box-shadow: 0 4px 20px var(--accent-glow); }
.btn-primary:active { transform: translateY(0); }
.btn-primary:disabled { opacity: .4; cursor: not-allowed; transform: none; }
.btn-ghost {
  background: transparent; color: var(--text-dim);
  border: 1px solid var(--border);
}
.btn-ghost:hover { border-color: var(--border2); color: var(--text); background: var(--card); }
.btn-sm { padding: 6px 12px; font-size: .78rem; border-radius: 6px; }

/* ── Toggle ── */
.toggle-row {
  display: flex; align-items: center; gap: 10px;
  font-size: .85rem; color: var(--text-dim);
  cursor: pointer; user-select: none;
}
.toggle-row input { display: none; }
.toggle-track {
  width: 36px; height: 20px;
  background: var(--border2); border-radius: 10px;
  position: relative; transition: background .2s; flex-shrink: 0;
}
.toggle-track::after {
  content: ''; position: absolute;
  top: 3px; left: 3px;
  width: 14px; height: 14px;
  border-radius: 50%; background: #fff;
  transition: transform .2s;
}
input:checked + .toggle-track { background: var(--accent); }
input:checked + .toggle-track::after { transform: translateX(16px); }

/* ── Scanner row ── */
.scan-row { display: flex; gap: 10px; align-items: flex-end; }
.scan-row .path-wrap { flex: 1; }
.options-row { display: flex; gap: 20px; flex-wrap: wrap; margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--border); }

/* ── Advanced (Musixmatch) ── */
.adv-toggle {
  font-size: .78rem; color: var(--text-muted);
  cursor: pointer; background: none; border: none;
  padding: 0; margin-top: 12px;
  display: flex; align-items: center; gap: 5px;
}
.adv-toggle:hover { color: var(--text-dim); }
.adv-body { display: none; margin-top: 12px; }
.adv-body.open { display: block; }

/* ── Stats bar ── */
.stats-bar {
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
}
.stat-pill {
  display: flex; align-items: center; gap: 6px;
  background: var(--card); border: 1px solid var(--border);
  border-radius: 20px; padding: 5px 12px;
  font-size: .78rem; color: var(--text-dim);
}
.stat-pill .dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
.dot-total  { background: var(--text-muted); }
.dot-lyrics { background: var(--success); }
.dot-done   { background: var(--accent-lt); }
.dot-err    { background: var(--error); }
.stats-bar .spacer { flex: 1; }

/* ── Progress ── */
.progress-wrap { margin-top: 12px; display: none; }
.progress-wrap.visible { display: block; }
.progress-track { height: 4px; background: var(--border); border-radius: 2px; overflow: hidden; }
.progress-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--accent), var(--accent-lt));
  border-radius: 2px; width: 0%;
  transition: width .3s ease;
}
.progress-label { font-size: .75rem; color: var(--text-muted); margin-top: 6px; text-align: right; }

/* ── File cards ── */
#file-list { display: flex; flex-direction: column; gap: 8px; }

.file-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
  transition: border-color .18s, box-shadow .18s;
}
.file-card:hover       { border-color: var(--border2); box-shadow: var(--shadow); }
.file-card.processing  { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent-glow); }
.file-card.success     { border-color: rgba(16,185,129,.4); }
.file-card.not-found   { border-color: rgba(245,158,11,.3); }
.file-card.errored     { border-color: rgba(239,68,68,.4); }

.file-card-top {
  display: flex; align-items: center; gap: 14px;
  padding: 14px 16px;
}
.file-icon {
  width: 38px; height: 38px; border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
  font-size: 16px; flex-shrink: 0;
}
.file-icon.mp3  { background: rgba(124,58,237,.15); }
.file-icon.m4a,
.file-icon.aac  { background: rgba(59,130,246,.15); }

.file-meta { flex: 1; min-width: 0; }
.file-name { font-size: .85rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.file-tags { font-size: .78rem; color: var(--text-dim); margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.file-tags em { font-style: normal; color: var(--text-muted); }

.file-actions { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }

/* ── Badges ── */
.badge {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 4px 10px; border-radius: 20px;
  font-size: .72rem; font-weight: 600; white-space: nowrap;
}
.badge-lyrics  { background: rgba(16,185,129,.12); color: var(--success); border: 1px solid rgba(16,185,129,.25); }
.badge-pending { background: var(--surface); color: var(--text-muted); border: 1px solid var(--border); }
.badge-spin    { background: rgba(124,58,237,.12); color: var(--accent-lt); border: 1px solid rgba(124,58,237,.3); }
.badge-ok      { background: rgba(16,185,129,.12); color: var(--success); border: 1px solid rgba(16,185,129,.3); }
.badge-warn    { background: rgba(245,158,11,.1); color: var(--warn); border: 1px solid rgba(245,158,11,.25); }
.badge-err     { background: rgba(239,68,68,.1); color: var(--error); border: 1px solid rgba(239,68,68,.25); }

/* ── Spinner ── */
@keyframes spin { to { transform: rotate(360deg); } }
.spinner {
  display: inline-block; width: 10px; height: 10px;
  border: 2px solid rgba(167,139,250,.3);
  border-top-color: var(--accent-lt);
  border-radius: 50%;
  animation: spin .7s linear infinite;
}

/* ── Lyrics panel ── */
.lyrics-panel {
  border-top: 1px solid var(--border);
  max-height: 0; overflow: hidden;
  transition: max-height .35s ease;
}
.lyrics-panel.open { max-height: 400px; }
.lyrics-inner { padding: 16px; }
.lyrics-source {
  display: inline-flex; align-items: center; gap: 5px;
  font-size: .72rem; color: var(--text-muted);
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 20px; padding: 3px 10px; margin-bottom: 10px;
}
.lyrics-text {
  font-size: .82rem; line-height: 1.8; color: var(--text-dim);
  white-space: pre-wrap; max-height: 300px; overflow-y: auto; padding-right: 6px;
}
.lyrics-text::-webkit-scrollbar { width: 4px; }
.lyrics-text::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 2px; }

/* ── Source chips ── */
.source-chip {
  font-size: .68rem; font-weight: 600;
  padding: 2px 7px; border-radius: 10px;
  background: rgba(59,130,246,.12);
  color: var(--info);
  border: 1px solid rgba(59,130,246,.25);
  white-space: nowrap;
}

/* ── Empty state ── */
.empty-state { text-align: center; padding: 60px 20px; color: var(--text-muted); }
.empty-state .big-icon { font-size: 48px; margin-bottom: 16px; opacity: .5; }
.empty-state h3 { font-size: 1rem; color: var(--text-dim); margin-bottom: 6px; }
.empty-state p  { font-size: .82rem; }

/* ── Toast ── */
#toast {
  position: fixed; bottom: 24px; left: 50%;
  transform: translateX(-50%) translateY(80px);
  background: var(--surface); border: 1px solid var(--border2);
  border-radius: 10px; padding: 12px 20px;
  font-size: .85rem; color: var(--text);
  box-shadow: var(--shadow);
  transition: transform .3s ease, opacity .3s;
  opacity: 0; pointer-events: none; z-index: 200;
  white-space: nowrap;
}
#toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }

.hidden { display: none !important; }

/* ── iPod section ── */
.section-divider {
  display: flex; align-items: center; gap: 14px;
  color: var(--text-muted); font-size: .72rem; font-weight: 600;
  letter-spacing: .08em; text-transform: uppercase;
}
.section-divider::before, .section-divider::after {
  content: ''; flex: 1; height: 1px; background: var(--border);
}

.track-table-wrap { overflow-x: auto; }
.track-table {
  width: 100%; border-collapse: collapse;
  font-size: .82rem;
}
.track-table th {
  text-align: left; padding: 9px 14px;
  font-size: .72rem; font-weight: 600; letter-spacing: .05em;
  text-transform: uppercase; color: var(--text-muted);
  border-bottom: 1px solid var(--border);
  white-space: nowrap;
}
.track-table td {
  padding: 9px 14px; border-bottom: 1px solid var(--border);
  color: var(--text-dim); vertical-align: middle;
}
.track-table tr:last-child td { border-bottom: none; }
.track-table tr:hover td { background: var(--card-hover); }
.track-table td.td-num { color: var(--text-muted); width: 42px; text-align: right; }
.track-table td.td-title { color: var(--text); font-weight: 500; max-width: 220px; }
.track-table td.td-trunc { max-width: 160px; }
.track-table td.td-dur { white-space: nowrap; color: var(--text-muted); }
.track-table td.td-acts { white-space: nowrap; text-align: right; }
.track-table .cell-text { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block; }

/* inline edit row */
.edit-row td { background: var(--surface); padding: 12px 14px; }
.edit-grid {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
  gap: 10px; margin-bottom: 10px;
}
.edit-grid label { font-size: .75rem; color: var(--text-muted); margin-bottom: 4px; display: block; }
.edit-grid input { font-size: .82rem; padding: 7px 10px; }
.edit-actions { display: flex; gap: 8px; justify-content: flex-end; }

/* add-track form */
.add-form-grid {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
  gap: 12px; margin-top: 14px;
}

/* sync log */
.sync-log {
  font-size: .75rem; color: var(--text-muted);
  max-height: 120px; overflow-y: auto;
  margin-top: 8px; padding: 8px 10px;
  background: var(--bg); border: 1px solid var(--border); border-radius: 6px;
  display: none;
}
.sync-log.visible { display: block; }
.sync-log .log-ok   { color: var(--success); }
.sync-log .log-miss { color: var(--warn); }
.sync-log .log-err  { color: var(--error); }
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <div class="logo">🎵</div>
    <div class="header-text">
      <h1>Lyrics Finder</h1>
      <p>Embed lyrics into MP3 &amp; M4A files automatically</p>
    </div>
    <span class="free-badge">✦ 100% FREE · NO API KEY</span>
  </div>
</header>

<main>

  <!-- Scanner -->
  <div class="panel">
    <div class="panel-header"><span>📁</span> Music Directory</div>
    <div class="panel-body">
      <div class="scan-row">
        <div class="path-wrap">
          <label for="dir-path">Folder containing your music files</label>
          <input type="text" id="dir-path" placeholder="/Users/you/Music">
        </div>
        <button class="btn-primary" id="btn-scan">
          <span id="scan-label">Scan</span>
        </button>
      </div>

      <div class="options-row">
        <label class="toggle-row">
          <input type="checkbox" id="opt-overwrite">
          <span class="toggle-track"></span>
          Overwrite existing lyrics
        </label>
        <label class="toggle-row">
          <input type="checkbox" id="opt-dryrun">
          <span class="toggle-track"></span>
          Dry run (no writes)
        </label>
      </div>

      <!-- Advanced: optional Musixmatch key -->
      <button class="adv-toggle" id="adv-toggle">▸ Advanced options</button>
      <div class="adv-body" id="adv-body">
        <label for="mm-key">Musixmatch API key <em style="color:var(--text-muted);font-style:normal">(optional — adds extra coverage)</em></label>
        <div style="display:flex;gap:8px">
          <input type="password" id="mm-key" placeholder="Leave blank to use free sources only" style="flex:1">
          <button class="btn-ghost" id="toggle-mm-key">👁</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Stats + batch -->
  <div id="stats-section" class="hidden">
    <div class="panel">
      <div class="panel-body">
        <div class="stats-bar">
          <div class="stat-pill"><span class="dot dot-total"></span><span id="stat-total">0 files</span></div>
          <div class="stat-pill"><span class="dot dot-lyrics"></span><span id="stat-lyrics">0 have lyrics</span></div>
          <div class="stat-pill"><span class="dot dot-done"></span><span id="stat-done">0 processed</span></div>
          <div class="stat-pill"><span class="dot dot-err"></span><span id="stat-err">0 errors</span></div>
          <div class="spacer"></div>
          <button class="btn-ghost btn-sm" id="btn-clear">✕ Clear</button>
          <button class="btn-primary" id="btn-all">▶ Process All</button>
        </div>
        <div class="progress-wrap" id="progress-wrap">
          <div class="progress-track"><div class="progress-fill" id="progress-fill"></div></div>
          <div class="progress-label" id="progress-label"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- File list -->
  <div id="file-list-section" class="hidden">
    <div id="file-list"></div>
  </div>

  <!-- ═══════════════════════ iPod Manager ═══════════════════════ -->
  <div class="section-divider">🎧 iPod Classic Manager</div>

  <!-- Connect panel -->
  <div class="panel">
    <div class="panel-header"><span>🔌</span> Connect</div>
    <div class="panel-body">
      <div class="scan-row">
        <div class="path-wrap">
          <label for="ipod-mount">iPod mount point</label>
          <input type="text" id="ipod-mount" placeholder="/Volumes/IPOD  (leave blank to auto-detect)">
        </div>
        <button class="btn-primary" id="btn-ipod-connect">
          <span id="ipod-connect-label">Connect</span>
        </button>
      </div>
    </div>
  </div>

  <!-- Stats + controls (hidden until connected) -->
  <div id="ipod-main" class="hidden">
    <div class="panel">
      <div class="panel-body">
        <div class="stats-bar">
          <div class="stat-pill"><span class="dot dot-total"></span><span id="ipod-stat-tracks">0 tracks</span></div>
          <div class="stat-pill" id="ipod-stat-fw-pill"><span id="ipod-stat-fw">—</span></div>
          <div class="stat-pill" id="ipod-stat-root-pill" style="font-size:.72rem;max-width:280px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap"><span id="ipod-stat-root">—</span></div>
          <div class="spacer"></div>
          <button class="btn-ghost btn-sm" id="btn-ipod-refresh">↺ Refresh</button>
          <button class="btn-ghost btn-sm" id="btn-ipod-add-toggle">+ Add Track</button>
          <button class="btn-primary" id="btn-sync-lyrics">♪ Sync Lyrics</button>
        </div>
        <!-- Sync progress -->
        <div class="progress-wrap" id="ipod-progress-wrap">
          <div class="progress-track"><div class="progress-fill" id="ipod-progress-fill"></div></div>
          <div class="progress-label" id="ipod-progress-label"></div>
        </div>
        <div class="sync-log" id="sync-log"></div>
      </div>
    </div>

    <!-- Add-track form -->
    <div id="ipod-add-form" class="panel hidden">
      <div class="panel-header"><span>+</span> Add Track to iPod</div>
      <div class="panel-body">
        <div class="scan-row">
          <div class="path-wrap">
            <label>Audio file <em style="color:var(--text-muted);font-style:normal">(MP3, M4A or AAC)</em></label>
            <input type="file" id="ipod-add-file" accept=".mp3,.m4a,.aac" style="color:var(--text-dim);background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:8px 12px;width:100%">
          </div>
        </div>
        <div class="add-form-grid">
          <div><label>Title override</label><input type="text" id="add-title" placeholder="(read from file)"></div>
          <div><label>Artist override</label><input type="text" id="add-artist" placeholder="(read from file)"></div>
          <div><label>Album override</label><input type="text" id="add-album" placeholder="(read from file)"></div>
          <div><label>Genre override</label><input type="text" id="add-genre" placeholder="(read from file)"></div>
          <div><label>Year</label><input type="text" id="add-year" placeholder="e.g. 2024"></div>
          <div><label>Track #</label><input type="text" id="add-tracknum" placeholder="e.g. 1"></div>
        </div>
        <div style="display:flex;gap:8px;margin-top:12px;justify-content:flex-end">
          <button class="btn-ghost btn-sm" id="btn-add-cancel">Cancel</button>
          <button class="btn-primary" id="btn-add-confirm">Add to iPod</button>
        </div>
      </div>
    </div>

    <!-- Track list -->
    <div class="panel">
      <div class="panel-header">
        <span>🎵</span> Library
        <span id="ipod-track-badge" style="margin-left:6px;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:2px 8px;font-size:.72rem;color:var(--text-muted)"></span>
        <div style="flex:1"></div>
        <input type="text" id="ipod-search" placeholder="Filter…" style="width:180px;padding:5px 10px;font-size:.78rem;background:var(--bg);border:1px solid var(--border);border-radius:6px;color:var(--text)">
      </div>
      <div class="track-table-wrap">
        <table class="track-table">
          <thead>
            <tr>
              <th>#</th>
              <th>Title</th>
              <th>Artist</th>
              <th>Album</th>
              <th>Dur</th>
              <th style="text-align:right">Actions</th>
            </tr>
          </thead>
          <tbody id="ipod-tbody"></tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- Edit modal -->
  <div id="edit-modal" class="hidden" style="position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:300;display:none;align-items:center;justify-content:center">
    <div style="background:var(--surface);border:1px solid var(--border2);border-radius:var(--radius);width:min(520px,95vw);padding:24px;box-shadow:var(--shadow)">
      <div style="font-weight:700;font-size:1rem;margin-bottom:18px">Edit Metadata</div>
      <input type="hidden" id="edit-track-id">
      <div class="edit-grid">
        <div><label>Title</label><input type="text" class="edit-field" data-field="title" id="ef-title"></div>
        <div><label>Artist</label><input type="text" class="edit-field" data-field="artist" id="ef-artist"></div>
        <div><label>Album</label><input type="text" class="edit-field" data-field="album" id="ef-album"></div>
        <div><label>Album Artist</label><input type="text" class="edit-field" data-field="album_artist" id="ef-album-artist"></div>
        <div><label>Genre</label><input type="text" class="edit-field" data-field="genre" id="ef-genre"></div>
        <div><label>Year</label><input type="text" class="edit-field" data-field="year" id="ef-year"></div>
        <div><label>Track #</label><input type="text" class="edit-field" data-field="track_number" id="ef-tracknum"></div>
        <div><label>Composer</label><input type="text" class="edit-field" data-field="composer" id="ef-composer"></div>
      </div>
      <div class="edit-actions" style="margin-top:16px">
        <button class="btn-ghost btn-sm" id="btn-edit-cancel">Cancel</button>
        <button class="btn-primary btn-sm" id="btn-edit-save">Save</button>
      </div>
    </div>
  </div>

</main>

<div id="toast"></div>

<script>
// ── State ──────────────────────────────────────────────────────────────────
const state = {
  files: [],
  results: {},
  processing: false,
  processedCount: 0,
  errorCount: 0,
};

const $ = id => document.getElementById(id);

function showToast(msg, type = '') {
  const t = $('toast');
  t.textContent = msg;
  t.style.borderColor = type === 'error'   ? 'rgba(239,68,68,.5)'
                      : type === 'success' ? 'rgba(16,185,129,.5)'
                      : 'var(--border2)';
  t.classList.add('show');
  clearTimeout(t._timer);
  t._timer = setTimeout(() => t.classList.remove('show'), 3200);
}

function isOverwrite() { return $('opt-overwrite').checked; }
function isDryRun()    { return $('opt-dryrun').checked; }
function mmKey()       { return $('mm-key').value.trim(); }

// ── Advanced toggle ────────────────────────────────────────────────────────
$('adv-toggle').addEventListener('click', () => {
  const body = $('adv-body');
  const btn  = $('adv-toggle');
  body.classList.toggle('open');
  btn.textContent = body.classList.contains('open') ? '▾ Advanced options' : '▸ Advanced options';
});
$('toggle-mm-key').addEventListener('click', () => {
  const inp = $('mm-key');
  inp.type = inp.type === 'password' ? 'text' : 'password';
});

// ── Persist Musixmatch key ─────────────────────────────────────────────────
(function() {
  const saved = localStorage.getItem('mmx_key');
  if (saved) $('mm-key').value = saved;
})();
$('mm-key').addEventListener('change', () => {
  const v = mmKey();
  if (v) localStorage.setItem('mmx_key', v);
  else localStorage.removeItem('mmx_key');
});

// ── Scan ───────────────────────────────────────────────────────────────────
$('btn-scan').addEventListener('click', scan);
$('dir-path').addEventListener('keydown', e => { if (e.key === 'Enter') scan(); });

async function scan() {
  const dir = $('dir-path').value.trim();
  if (!dir) { showToast('Enter a directory path', 'error'); return; }

  $('scan-label').textContent = '…';
  $('btn-scan').disabled = true;

  try {
    const res  = await fetch('/api/scan', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({directory: dir}) });
    const data = await res.json();
    if (!res.ok) { showToast(data.error || 'Scan failed', 'error'); return; }

    state.files = data.files;
    state.results = {};
    state.processedCount = 0;
    state.errorCount = 0;
    renderFileList();
    updateStats();
    $('stats-section').classList.remove('hidden');
    $('file-list-section').classList.remove('hidden');
    showToast(`Found ${data.count} file${data.count !== 1 ? 's' : ''}`, 'success');
  } catch(e) {
    showToast('Network error: ' + e.message, 'error');
  } finally {
    $('scan-label').textContent = 'Scan';
    $('btn-scan').disabled = false;
  }
}

// ── Stats ──────────────────────────────────────────────────────────────────
function updateStats() {
  const total = state.files.length;
  const hasLyrics = state.files.filter(f => {
    const r = state.results[f.path];
    return f.has_lyrics || (r && r.status === 'success');
  }).length;
  $('stat-total').textContent  = `${total} file${total !== 1 ? 's' : ''}`;
  $('stat-lyrics').textContent = `${hasLyrics} have lyrics`;
  $('stat-done').textContent   = `${state.processedCount} processed`;
  $('stat-err').textContent    = `${state.errorCount} error${state.errorCount !== 1 ? 's' : ''}`;
}

// ── Render file list ───────────────────────────────────────────────────────
function renderFileList() {
  const list = $('file-list');
  list.innerHTML = '';
  if (!state.files.length) {
    list.innerHTML = `<div class="empty-state">
      <div class="big-icon">🎵</div>
      <h3>No audio files found</h3>
      <p>Try a different directory — looking for .mp3, .m4a, .aac</p>
    </div>`;
    return;
  }
  state.files.forEach((file, idx) => list.appendChild(buildCard(file, idx)));
}

function buildCard(file, idx) {
  const r      = state.results[file.path];
  const status = r ? r.status : (file.has_lyrics ? 'has_lyrics' : 'idle');

  const card = document.createElement('div');
  card.className = 'file-card';
  card.id = `card-${idx}`;
  if (status === 'processing')       card.classList.add('processing');
  else if (status === 'success')     card.classList.add('success');
  else if (status === 'not_found')   card.classList.add('not-found');
  else if (r && r.error)             card.classList.add('errored');

  const fext = (file.name.split('.').pop() || '').toLowerCase();
  const icon = fext === 'mp3' ? '🎵' : '🎶';
  const titleLine = file.title
    ? `<span>${esc(file.title)}</span> <em>—</em> <span>${esc(file.artist || 'Unknown artist')}</span>`
    : `<em>No title tag</em>`;

  const top = document.createElement('div');
  top.className = 'file-card-top';
  top.innerHTML = `
    <div class="file-icon ${fext}">${icon}</div>
    <div class="file-meta">
      <div class="file-name">${esc(file.name)}</div>
      <div class="file-tags">${titleLine}${file.album ? ` <em>·</em> ${esc(file.album)}` : ''}</div>
    </div>
    <div class="file-actions" id="actions-${idx}"></div>
  `;
  card.appendChild(top);

  const actions = top.querySelector(`#actions-${idx}`);

  // Source chip
  if (r && r.source) {
    const chip = document.createElement('span');
    chip.className = 'source-chip';
    chip.textContent = r.source;
    actions.appendChild(chip);
  }

  // Status badge
  actions.appendChild(buildBadge(status, r));

  // Lyrics preview button
  if (r && r.lyrics) {
    const btn = document.createElement('button');
    btn.className = 'btn-ghost btn-sm';
    btn.textContent = '📜 Lyrics';
    btn.addEventListener('click', () => toggleLyrics(card, r));
    actions.appendChild(btn);
  }

  // Process / retry button
  if (status !== 'processing') {
    const btn = document.createElement('button');
    btn.className = 'btn-ghost btn-sm';
    btn.textContent = (status === 'idle' || status === 'has_lyrics') ? '▶ Find' : '↺ Retry';
    btn.addEventListener('click', () => processSingle(file, idx));
    actions.appendChild(btn);
  }

  // Lyrics panel
  if (r && r.lyrics) card.appendChild(buildLyricsPanel(r));

  return card;
}

function buildBadge(status, r) {
  const b = document.createElement('span');
  b.className = 'badge';
  if (r && r.error) {
    b.className = 'badge badge-err';
    b.title = r.error;
    b.textContent = '✗ Error';
  } else if (status === 'processing') {
    b.className = 'badge badge-spin';
    b.innerHTML = '<span class="spinner"></span> Searching…';
  } else if (status === 'success') {
    b.className = 'badge badge-ok';
    b.textContent = r.dry_run ? '☁ Preview' : '✓ Written';
  } else if (status === 'has_lyrics') {
    b.className = 'badge badge-lyrics';
    b.textContent = '♪ Has lyrics';
  } else if (status === 'not_found') {
    b.className = 'badge badge-warn';
    b.textContent = '○ Not found';
  } else if (status === 'skipped') {
    b.className = 'badge badge-warn';
    b.textContent = r.reason === 'no_title' ? '⊘ No title tag' : '⊘ Has lyrics';
  } else {
    b.className = 'badge badge-pending';
    b.textContent = '○ Pending';
  }
  return b;
}

function buildLyricsPanel(r) {
  const panel = document.createElement('div');
  panel.className = 'lyrics-panel';
  const inner = document.createElement('div');
  inner.className = 'lyrics-inner';
  inner.innerHTML = `
    <div class="lyrics-source">🔍 via ${esc(r.source || 'unknown')}</div>
    <div class="lyrics-text">${esc(r.lyrics)}</div>
  `;
  panel.appendChild(inner);
  return panel;
}

function toggleLyrics(card, r) {
  let panel = card.querySelector('.lyrics-panel');
  if (!panel) { panel = buildLyricsPanel(r); card.appendChild(panel); }
  panel.classList.toggle('open');
}

// ── Process single ─────────────────────────────────────────────────────────
async function processSingle(file, idx) {
  setCardProcessing(idx, file);

  try {
    const res = await fetch('/api/process', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({
        path: file.path,
        overwrite: isOverwrite(),
        dry_run: isDryRun(),
        musixmatch_key: mmKey(),
      }),
    });
    const data = await res.json();
    if (!res.ok) {
      state.results[file.path] = {status: 'error', error: data.error || 'Unknown error'};
      state.errorCount++;
    } else {
      state.results[file.path] = data;
      state.processedCount++;
      if (data.status === 'success' && !data.dry_run) file.has_lyrics = true;
    }
  } catch(e) {
    state.results[file.path] = {status: 'error', error: e.message};
    state.errorCount++;
  }

  refreshCard(file, idx);
  updateStats();
}

function setCardProcessing(idx, file) {
  state.results[file.path] = {status: 'processing'};
  const card = $(`card-${idx}`);
  if (!card) return;
  card.className = 'file-card processing';
  const actions = card.querySelector(`#actions-${idx}`);
  if (actions) {
    actions.innerHTML = '';
    const b = document.createElement('span');
    b.className = 'badge badge-spin';
    b.innerHTML = '<span class="spinner"></span> Searching…';
    actions.appendChild(b);
  }
}

function refreshCard(file, idx) {
  const old = $(`card-${idx}`);
  if (old) old.replaceWith(buildCard(file, idx));
}

// ── Process all ────────────────────────────────────────────────────────────
$('btn-all').addEventListener('click', processAll);

async function processAll() {
  if (state.processing) return;

  const toProcess = state.files.filter(f => {
    const r = state.results[f.path];
    if (r && (r.status === 'success' || r.status === 'processing')) return false;
    if (f.has_lyrics && !isOverwrite()) return false;
    return true;
  });

  if (!toProcess.length) { showToast('Nothing to process', 'error'); return; }

  state.processing = true;
  state.processedCount = 0;
  state.errorCount = 0;
  $('btn-all').disabled = true;

  const pw = $('progress-wrap');
  const pf = $('progress-fill');
  const pl = $('progress-label');
  pw.classList.add('visible');

  for (let i = 0; i < toProcess.length; i++) {
    const file = toProcess[i];
    const idx  = state.files.indexOf(file);
    pf.style.width = `${(i / toProcess.length) * 100}%`;
    pl.textContent = `${i + 1} / ${toProcess.length} — ${file.name}`;
    await processSingle(file, idx);
    await new Promise(r => setTimeout(r, 100));
  }

  pf.style.width = '100%';
  pl.textContent = `Done — ${state.processedCount} processed, ${state.errorCount} error${state.errorCount !== 1 ? 's' : ''}`;
  showToast(`Finished ${toProcess.length} file${toProcess.length !== 1 ? 's' : ''}`, 'success');
  state.processing = false;
  $('btn-all').disabled = false;
}

// ── Clear ──────────────────────────────────────────────────────────────────
$('btn-clear').addEventListener('click', () => {
  state.files = []; state.results = {};
  state.processedCount = 0; state.errorCount = 0;
  $('stats-section').classList.add('hidden');
  $('file-list-section').classList.add('hidden');
  $('file-list').innerHTML = '';
  $('progress-wrap').classList.remove('visible');
});

// ── Escape HTML ────────────────────────────────────────────────────────────
function esc(s) {
  return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ══════════════════════════════════════════════════════════════════════════
// iPod Manager
// ══════════════════════════════════════════════════════════════════════════

const ipod = {
  mount: '',
  tracks: [],
  syncing: false,
};

function ipodMount() { return $('ipod-mount').value.trim(); }

// ── Connect ───────────────────────────────────────────────────────────────
$('btn-ipod-connect').addEventListener('click', ipodConnect);
$('ipod-mount').addEventListener('keydown', e => { if (e.key === 'Enter') ipodConnect(); });

async function ipodConnect() {
  const btn = $('btn-ipod-connect');
  $('ipod-connect-label').textContent = '…';
  btn.disabled = true;
  try {
    const res  = await fetch('/api/ipod/detect', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({mount: ipodMount()}),
    });
    const data = await res.json();
    if (!res.ok) { showToast(data.error || 'Connection failed', 'error'); return; }

    ipod.mount = data.root;
    $('ipod-stat-tracks').textContent = `${data.track_count} track${data.track_count !== 1 ? 's' : ''}`;
    $('ipod-stat-fw').textContent = `💿 ${data.firmware}`;
    $('ipod-stat-root').textContent = data.root;
    $('ipod-main').classList.remove('hidden');
    showToast(`Connected: ${data.root}`, 'success');
    await ipodLoadTracks();
  } catch(e) {
    showToast('Network error: ' + e.message, 'error');
  } finally {
    $('ipod-connect-label').textContent = 'Connect';
    btn.disabled = false;
  }
}

// ── Load tracks ───────────────────────────────────────────────────────────
$('btn-ipod-refresh').addEventListener('click', ipodLoadTracks);

async function ipodLoadTracks() {
  $('ipod-tbody').innerHTML = `<tr><td colspan="6" style="text-align:center;color:var(--text-muted);padding:24px">Loading…</td></tr>`;
  try {
    const res  = await fetch('/api/ipod/tracks', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({mount: ipod.mount}),
    });
    const data = await res.json();
    if (!res.ok) { showToast(data.error || 'Failed to load tracks', 'error'); return; }
    ipod.tracks = data.tracks;
    ipodRenderTracks(ipod.tracks);
    $('ipod-track-badge').textContent = `${ipod.tracks.length} tracks`;
  } catch(e) {
    showToast('Network error: ' + e.message, 'error');
  }
}

// ── Render tracks ─────────────────────────────────────────────────────────
$('ipod-search').addEventListener('input', () => {
  const q = $('ipod-search').value.toLowerCase();
  const filtered = q
    ? ipod.tracks.filter(t =>
        (t.title+t.artist+t.album).toLowerCase().includes(q))
    : ipod.tracks;
  ipodRenderTracks(filtered);
});

function ipodRenderTracks(tracks) {
  const tbody = $('ipod-tbody');
  if (!tracks.length) {
    tbody.innerHTML = `<tr><td colspan="6" style="text-align:center;color:var(--text-muted);padding:40px">No tracks found</td></tr>`;
    return;
  }
  tbody.innerHTML = '';
  tracks.forEach(t => tbody.appendChild(buildTrackRow(t)));
}

function buildTrackRow(t) {
  const tr = document.createElement('tr');
  tr.id = `itr-${t.id}`;
  const dur = fmtDur(t.duration);
  tr.innerHTML = `
    <td class="td-num">${t.id}</td>
    <td class="td-title"><span class="cell-text" title="${esc(t.title)}">${esc(t.title || '—')}</span></td>
    <td class="td-trunc"><span class="cell-text" title="${esc(t.artist)}">${esc(t.artist || '—')}</span></td>
    <td class="td-trunc"><span class="cell-text" title="${esc(t.album)}">${esc(t.album || '—')}</span></td>
    <td class="td-dur">${dur}</td>
    <td class="td-acts">
      <button class="btn-ghost btn-sm" onclick="openEditModal(${t.id})">✎</button>
      <button class="btn-ghost btn-sm" style="color:var(--error)" onclick="ipodRemove(${t.id}, this)">✕</button>
    </td>
  `;
  return tr;
}

function fmtDur(ms) {
  if (!ms) return '—';
  const s = Math.floor(ms / 1000);
  return `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`;
}

// ── Remove track ──────────────────────────────────────────────────────────
async function ipodRemove(trackId, btn) {
  if (!confirm(`Remove track #${trackId} from iPod?`)) return;
  btn.disabled = true;
  try {
    const res  = await fetch('/api/ipod/remove', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({mount: ipod.mount, track_id: trackId}),
    });
    const data = await res.json();
    if (!res.ok) { showToast(data.error || 'Remove failed', 'error'); btn.disabled = false; return; }
    ipod.tracks = ipod.tracks.filter(t => t.id !== trackId);
    const row = $(`itr-${trackId}`);
    if (row) row.remove();
    $('ipod-track-badge').textContent = `${ipod.tracks.length} tracks`;
    $('ipod-stat-tracks').textContent = `${ipod.tracks.length} track${ipod.tracks.length !== 1 ? 's' : ''}`;
    showToast(`Track ${trackId} removed`, 'success');
  } catch(e) {
    showToast('Network error: ' + e.message, 'error');
    btn.disabled = false;
  }
}

// ── Add track ─────────────────────────────────────────────────────────────
$('btn-ipod-add-toggle').addEventListener('click', () => {
  $('ipod-add-form').classList.toggle('hidden');
});
$('btn-add-cancel').addEventListener('click', () => {
  $('ipod-add-form').classList.add('hidden');
});
$('btn-add-confirm').addEventListener('click', ipodAddTrack);

async function ipodAddTrack() {
  const fileInput = $('ipod-add-file');
  if (!fileInput.files.length) { showToast('Select a file first', 'error'); return; }

  const btn = $('btn-add-confirm');
  btn.disabled = true; btn.textContent = 'Adding…';

  const form = new FormData();
  form.append('mount', ipod.mount);
  form.append('file', fileInput.files[0]);
  form.append('title',      $('add-title').value.trim());
  form.append('artist',     $('add-artist').value.trim());
  form.append('album',      $('add-album').value.trim());
  form.append('genre',      $('add-genre').value.trim());
  form.append('year',       $('add-year').value.trim());
  form.append('track_number', $('add-tracknum').value.trim());

  try {
    const res  = await fetch('/api/ipod/add', {method: 'POST', body: form});
    const data = await res.json();
    if (!res.ok) { showToast(data.error || 'Add failed', 'error'); return; }

    const t = data.track;
    ipod.tracks.push(t);
    $('ipod-tbody').appendChild(buildTrackRow(t));
    $('ipod-track-badge').textContent = `${ipod.tracks.length} tracks`;
    $('ipod-stat-tracks').textContent = `${ipod.tracks.length} tracks`;
    $('ipod-add-form').classList.add('hidden');
    fileInput.value = '';
    showToast(`Added: ${t.title || fileInput.files[0].name}`, 'success');
  } catch(e) {
    showToast('Network error: ' + e.message, 'error');
  } finally {
    btn.disabled = false; btn.textContent = 'Add to iPod';
  }
}

// ── Edit modal ────────────────────────────────────────────────────────────
const editModal = $('edit-modal');

function openEditModal(trackId) {
  const t = ipod.tracks.find(t => t.id === trackId);
  if (!t) return;
  $('edit-track-id').value  = trackId;
  $('ef-title').value       = t.title || '';
  $('ef-artist').value      = t.artist || '';
  $('ef-album').value       = t.album || '';
  $('ef-album-artist').value = '';
  $('ef-genre').value       = t.genre || '';
  $('ef-year').value        = t.year || '';
  $('ef-tracknum').value    = t.track_number || '';
  $('ef-composer').value    = '';
  editModal.style.display   = 'flex';
}

$('btn-edit-cancel').addEventListener('click', () => { editModal.style.display = 'none'; });
editModal.addEventListener('click', e => { if (e.target === editModal) editModal.style.display = 'none'; });

$('btn-edit-save').addEventListener('click', async () => {
  const trackId = parseInt($('edit-track-id').value);
  const payload = {mount: ipod.mount, track_id: trackId};
  document.querySelectorAll('.edit-field').forEach(inp => {
    if (inp.value !== '') payload[inp.dataset.field] = inp.value;
  });

  $('btn-edit-save').disabled = true;
  try {
    const res  = await fetch('/api/ipod/update', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify(payload),
    });
    const data = await res.json();
    if (!res.ok) { showToast(data.error || 'Update failed', 'error'); return; }

    // Update local state and re-render row
    const t = ipod.tracks.find(t => t.id === trackId);
    if (t) {
      if (payload.title)  t.title  = payload.title;
      if (payload.artist) t.artist = payload.artist;
      if (payload.album)  t.album  = payload.album;
      if (payload.genre)  t.genre  = payload.genre;
      if (payload.year)   t.year   = parseInt(payload.year);
      if (payload.track_number) t.track_number = parseInt(payload.track_number);
      const row = $(`itr-${trackId}`);
      if (row) row.replaceWith(buildTrackRow(t));
    }
    editModal.style.display = 'none';
    showToast('Track updated', 'success');
  } catch(e) {
    showToast('Network error: ' + e.message, 'error');
  } finally {
    $('btn-edit-save').disabled = false;
  }
});

// ── Sync lyrics ───────────────────────────────────────────────────────────
$('btn-sync-lyrics').addEventListener('click', ipodSyncLyrics);

function ipodSyncLyrics() {
  if (ipod.syncing) return;
  ipod.syncing = true;
  $('btn-sync-lyrics').disabled = true;

  const pw  = $('ipod-progress-wrap');
  const pf  = $('ipod-progress-fill');
  const pl  = $('ipod-progress-label');
  const log = $('sync-log');
  pw.classList.add('visible');
  log.innerHTML = '';
  log.classList.add('visible');

  const params = new URLSearchParams({mount: ipod.mount, musixmatch_key: mmKey()});
  const src = new EventSource(`/api/ipod/sync-lyrics?${params}`);

  src.onmessage = (e) => {
    const d = JSON.parse(e.data);

    if (d.error) {
      showToast(d.error, 'error');
      src.close(); ipod.syncing = false; $('btn-sync-lyrics').disabled = false;
      return;
    }

    if (d.done) {
      pf.style.width = '100%';
      pl.textContent = `Done — ${d.found} lyrics added out of ${d.total} tracks`;
      showToast(`Synced ${d.found}/${d.total} track${d.total !== 1 ? 's' : ''} with lyrics`, 'success');
      src.close(); ipod.syncing = false; $('btn-sync-lyrics').disabled = false;
      return;
    }

    const pct = Math.round((d.i / d.total) * 100);
    pf.style.width = `${pct}%`;
    pl.textContent = `${d.i} / ${d.total} — ${d.track}`;

    if (d.status === 'found') {
      const line = document.createElement('div');
      line.className = 'log-ok';
      line.textContent = `✓ ${d.track} (${d.source})`;
      log.appendChild(line);
      log.scrollTop = log.scrollHeight;
    } else if (d.status === 'not_found' || d.status === 'missing') {
      // suppress — only log successes and errors to keep the log readable
    } else if (d.status === 'error') {
      const line = document.createElement('div');
      line.className = 'log-err';
      line.textContent = `✗ ${d.track}: ${d.error}`;
      log.appendChild(line);
      log.scrollTop = log.scrollHeight;
    }
  };

  src.onerror = () => {
    showToast('Sync connection lost', 'error');
    src.close(); ipod.syncing = false; $('btn-sync-lyrics').disabled = false;
  };
}
</script>
</body>
</html>
